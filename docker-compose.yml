services:
  dashboard:
    build: .
    image: p2p-arb-bot
    container_name: p2p-arb-dashboard
    # Toma los valores de .env (crea uno con `make env` o `cp .env.example .env`).
    env_file:
      - path: .env
        required: false
    environment:
      # El bot (subproceso lanzado por el dashboard) corre sin prompts.
      NO_INPUT: "true"
      # Fichas PNG por oportunidad: función dev-only, apagada en producción.
      # (environment tiene prioridad sobre env_file, así que blinda aunque el .env
      # traiga SCREENSHOTS=true.)
      SCREENSHOTS: "false"
      # DB, logs y estado van al volumen persistente (/data), no a la capa
      # efímera del contenedor. Así sobreviven a recreaciones.
      DB_PATH: "/data/opportunities.db"
      LOG_PATH: "/data/p2p_arb_bot.log"
      STATUS_PATH: "/data/status.json"
      SCREENSHOTS_DIR: "/data/screenshots"
      BOT_PIDFILE: "/data/bot.pid"
      # El dashboard edita este .env al guardar config; el bind-mount de abajo
      # lo deja en el mismo fichero que lee env_file.
      ENV_PATH: "/app/.env"
      # Puerto INTERNO del contenedor fijo a 8000 (sobreescribe el valor de
      # .env). El puerto del host se mapea aparte en `ports` para evitar
      # conflictos con otras apps del servidor.
      DASHBOARD_PORT: "8000"
    ports:
      # Publica solo en loopback; el acceso público va por nginx + TLS.
      # 8003 en el host -> 8000 dentro del contenedor.
      - "127.0.0.1:8003:8000"
    volumes:
      # Persiste la base de datos SQLite, los logs y el estado entre reinicios.
      - arb-data:/data
      # .env editable desde el dashboard (mismo fichero que lee env_file).
      - ./.env:/app/.env
      # Capturas (fichas PNG por oportunidad) visibles directamente en el host.
      # Se monta sobre SCREENSHOTS_DIR (/data/screenshots) para verlas sin docker cp.
      - ./capturas_oportunidades:/data/screenshots
    restart: unless-stopped
    # Permiten correr el bot por CLI con `docker compose run --rm dashboard ...`.
    stdin_open: true
    tty: true

volumes:
  arb-data:
